# publish-mcp-server.yml
# Purpose:       Build and publish MCP server container images to ghcr.io on
#                merge to main when /services or /mcp change. Closes the
#                Kiro -> CI -> registry -> Kiro loop.
# Owner:         TODO(human): assign-owner
# Last-reviewed: 2026-05-19

name: publish-mcp-server

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'mcp/**'
  workflow_dispatch:
    inputs:
      server:
        description: 'Server id under /services and /mcp (e.g. example-server)'
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write   # reserved for cosign / SLSA in a follow-up; unused here

concurrency:
  group: publish-mcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    name: Discover changed servers
    runs-on: ubuntu-latest
    outputs:
      servers: ${{ steps.set.outputs.servers }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need previous commit for changed-files diff

      - name: List changed files
        id: changed
        if: github.event_name == 'push'
        uses: tj-actions/changed-files@v45
        with:
          files: |
            services/**
            mcp/**
          separator: "\n"

      - name: Derive matrix of server ids
        id: set
        uses: actions/github-script@v7
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
          DISPATCH_SERVER: ${{ github.event.inputs.server }}
          EVENT_NAME: ${{ github.event_name }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Manual dispatch path: use the user-supplied server id.
            if (process.env.EVENT_NAME === 'workflow_dispatch') {
              const id = (process.env.DISPATCH_SERVER || '').trim();
              if (!id) { core.setFailed('workflow_dispatch.inputs.server is required'); return; }
              core.setOutput('servers', JSON.stringify([id]));
              return;
            }

            // Push path: derive ids from changed paths.
            const changed = (process.env.CHANGED_FILES || '')
              .split('\n').map(s => s.trim()).filter(Boolean);

            const ids = new Set();
            for (const p of changed) {
              const parts = p.split('/');
              if (parts[0] === 'services' && parts.length >= 2) {
                ids.add(parts[1]);
              } else if (parts[0] === 'mcp' && parts.length === 2 && p.endsWith('.yaml')) {
                ids.add(parts[1].replace(/\.yaml$/, ''));
              }
            }

            // Keep only ids that have BOTH a /services/<id>/Dockerfile and
            // a /mcp/<id>.yaml in the tree. Otherwise skip silently.
            const finalIds = [...ids].filter(id =>
              fs.existsSync(path.join('services', id, 'Dockerfile')) &&
              fs.existsSync(path.join('mcp', `${id}.yaml`))
            );

            core.info(`Servers to publish: ${JSON.stringify(finalIds)}`);
            core.setOutput('servers', JSON.stringify(finalIds));

  publish:
    name: Publish ${{ matrix.server }}
    needs: discover
    if: needs.discover.outputs.servers != '[]' && needs.discover.outputs.servers != ''
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.discover.outputs.servers) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read metadata from mcp/<server>.yaml
        id: meta
        env:
          SERVER: ${{ matrix.server }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import yaml,sys; print(yaml.safe_load(open(f'mcp/{sys.argv[1]}.yaml'))['version'])" "$SERVER")
          OWNER_LC=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LC}/${SERVER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE"     >> "$GITHUB_OUTPUT"
          echo "owner_lc=$OWNER_LC" >> "$GITHUB_OUTPUT"
          echo "Publishing $IMAGE:$VERSION"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.server }}
          file: services/${{ matrix.server }}/Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          provenance: false
          sbom: false

      - name: Make package public (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER: ${{ matrix.server }}
        run: |
          set -euo pipefail
          # TODO(human): switch to /orgs/<org>/packages/... if this repo
          # moves under a GitHub organization. The user endpoint below
          # only works while the repo owner is a user account.
          curl -sS -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/${SERVER}/visibility" \
            -d '{"visibility":"public"}' || true
          echo "Visibility set request sent (non-fatal on first push race)."

      - name: Smoke-test the pushed image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE}:${VERSION}"
          # The MCP server speaks JSON-RPC on stdio. A `--version` flag is
          # not available, so we just verify the container starts and is
          # ready to accept stdin. We send EOF immediately and check exit.
          echo "" | timeout 10s docker run --rm -i "${IMAGE}:${VERSION}" || EXIT=$?
          # Exit 124 (timeout reached) or 0 both mean the binary started.
          # Any other exit code is a failure.
          case "${EXIT:-0}" in
            0|124) echo "Smoke test OK (exit=${EXIT:-0})";;
            *) echo "Smoke test FAILED (exit=${EXIT})"; exit "${EXIT}";;
          esac

      - name: Run eval against published image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # TODO(human): wire the eval-runner CLI once it exists. The
          # eval suite is authored at evals/publish-mcp-server.yaml.
          echo "TODO(human): run evals/publish-mcp-server.yaml against ${IMAGE}:${VERSION}"
