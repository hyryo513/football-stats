# auto-merge.yml
# Purpose:      Auto-merge low-risk PRs from approved bot authors once all
#               required checks have passed. Never merges risk:high.
# Owner:        TODO(human): assign-owner
# Last-reviewed: 2026-05-19

name: auto-merge

on:
  check_suite:
    types: [completed]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  evaluate:
    name: Evaluate and merge
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether to merge
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const APPROVED_BOTS = new Set([
              "github-actions[bot]",
              "kiro-agent[bot]",
            ]);

            const { owner, repo } = context.repo;

            // Collect candidate PRs depending on the trigger.
            let prs = [];
            if (context.eventName === "pull_request") {
              prs = [context.payload.pull_request];
            } else if (context.eventName === "check_suite") {
              prs = context.payload.check_suite.pull_requests || [];
            }

            for (const prRef of prs) {
              // pull_request webhook delivers the full object; check_suite
              // delivers a stub, so re-fetch to get labels and author.
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: prRef.number,
              });

              const labels = (pr.labels || []).map(l => l.name);
              const author = pr.user && pr.user.login;

              if (labels.includes("risk:high")) {
                core.info(`PR #${pr.number}: risk:high -> never auto-merge`);
                continue;
              }
              if (!labels.includes("risk:low")) {
                core.info(`PR #${pr.number}: no risk:low label yet -> skip`);
                continue;
              }
              if (!APPROVED_BOTS.has(author)) {
                core.info(`PR #${pr.number}: author ${author} not approved`);
                continue;
              }
              if (pr.draft) {
                core.info(`PR #${pr.number}: draft -> skip`);
                continue;
              }
              if (pr.mergeable_state && pr.mergeable_state !== "clean") {
                core.info(`PR #${pr.number}: mergeable_state=${pr.mergeable_state} -> skip`);
                continue;
              }

              // Verify all required checks on the PR head SHA passed.
              // We use the combined status + check runs as a conservative gate.
              const sha = pr.head.sha;
              const [{ data: status }, { data: runs }] = await Promise.all([
                github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: sha }),
                github.rest.checks.listForRef({ owner, repo, ref: sha, per_page: 100 }),
              ]);

              if (status.state !== "success") {
                core.info(`PR #${pr.number}: combined status=${status.state} -> skip`);
                continue;
              }

              const failed = (runs.check_runs || []).filter(r =>
                r.status === "completed" &&
                !["success", "neutral", "skipped"].includes(r.conclusion)
              );
              if (failed.length > 0) {
                core.info(`PR #${pr.number}: ${failed.length} check(s) failed -> skip`);
                continue;
              }

              core.info(`PR #${pr.number}: merging (squash)`);
              await github.rest.pulls.merge({
                owner, repo, pull_number: pr.number, merge_method: "squash",
              });
            }
