# risk-tier.yml
# Purpose:      Label every PR as risk:high or risk:low based on changed
#               paths. Used by auto-merge.yml to gate automation.
# Owner:        TODO(human): assign-owner
# Last-reviewed: 2026-05-19

name: risk-tier

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Apply risk tier label
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List changed files
        id: changed
        uses: tj-actions/changed-files@v45
        with:
          # Newline-separated list of changed paths exposed as
          # steps.changed.outputs.all_changed_files.
          separator: "\n"

      - name: Classify and label
        uses: actions/github-script@v7
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const changed = (process.env.CHANGED_FILES || "")
              .split("\n")
              .map(p => p.trim())
              .filter(Boolean);

            // High-risk path matchers. Keep this list in sync with
            // CLAUDE.md "Agent constraints" and the docs in /mcp/, /tools/.
            const HIGH_RISK_GLOBS = [
              /(^|\/)iac\//,
              /(^|\/)auth\//,
              /(^|\/)security\//,
              /^\.github\/workflows\//,
              /(^|\/)mcp\//,
              /(^|\/)tools\//,
            ];
            const LOCKFILES = new Set([
              "package-lock.json",
              "poetry.lock",
              "requirements.txt",
              "Pipfile.lock",
              "yarn.lock",
              "go.sum",
            ]);

            const isHighRisk = changed.some(path => {
              const base = path.split("/").pop();
              if (LOCKFILES.has(base)) return true;
              return HIGH_RISK_GLOBS.some(re => re.test(path));
            });

            const wantLabel = isHighRisk ? "risk:high" : "risk:low";
            const dropLabel = isHighRisk ? "risk:low"  : "risk:high";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            core.info(`Changed files: ${changed.length}`);
            core.info(`Applying ${wantLabel}; removing ${dropLabel} if present.`);

            await github.rest.issues.addLabels({
              owner, repo, issue_number, labels: [wantLabel],
            });

            try {
              await github.rest.issues.removeLabel({
                owner, repo, issue_number, name: dropLabel,
              });
            } catch (err) {
              if (err.status !== 404) throw err;
            }
