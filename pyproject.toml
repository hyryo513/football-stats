[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-stats"
version = "0.1.0"
description = "Local soccer player tracking and statistics analysis service."
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn",
  "opencv-python==4.10.0.84",
  "ultralytics",
  "torch",
  "numpy<2",
  "yt-dlp",
  "sqlalchemy",
  "reportlab",
  "pytesseract",
  "google-auth-oauthlib",
  "google-api-python-client",
  "python-multipart",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "hypothesis",
  "httpx",
  "ruff",
  "mypy",
  "pre-commit",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
  "venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["venv"]

[[tool.mypy.overrides]]
module = ["backend.*", "tests.*"]
check_untyped_defs = true
