# Example MCP server definition (template).
# Replace contents when authoring a real server. Files under /mcp/ are
# risk:high — changes require human review.

name: example-server
version: 0.2.0
description: >
  Example MCP server exposing a single echo tool. Implementation lives
  under /services/example-server/; the published image is referenced by
  `artifact` and `transport.image` below.
owner: "TODO(human): assign-owner"
last-reviewed: 2026-05-19

artifact:
  registry: ghcr.io
  # The publish workflow substitutes the lower-cased repo owner at build
  # time. The tag MUST equal the top-level `version` field above.
  image: ghcr.io/hyryo513/example-server
  tag: 0.2.0
  # digest: sha256:...   # filled by a follow-up auto-bump PR (deferred)

transport:
  type: stdio
  image: ghcr.io/hyryo513/example-server:0.2.0
  command: example-mcp-server
  args: []

tool-surface:
  - name: example-tool
    ref: tools/example-tool.json

permissions:
  filesystem:
    # Empty by default. Add absolute paths or glob patterns only with a
    # justification comment.
    read: []
    write: []
  network:
    # Hostnames the server is allowed to reach. Empty means none.
    allow-hosts: []
  secrets:
    # Named secret references resolved at runtime via the host store.
    # Never embed secret values here.
    - EXAMPLE_API_TOKEN
  env:
    # Environment variables the server may read.
    - EXAMPLE_LOG_LEVEL

# Notes for reviewers:
# - TODO(human): confirm whether this server should be stdio (local) or
#   sse/http (networked) once we have a concrete use case.
# - TODO(human): assign owner before flipping status to production.
